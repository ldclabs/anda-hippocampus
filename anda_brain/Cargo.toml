[package]
name = "anda_brain"
publish = true
version = "0.11.0"
description.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[lib]
doctest = false

[[bin]]
name = "anda_brain"
path = "src/bin/main.rs"
# The service binary is the full product: it serves the wiki routes and the
# MCP endpoint, so it cannot be built from the lean default library.
required-features = ["mcp", "wiki"]

[features]
default = []
# Structured wiki: documents, versions, ACL-scoped reads, OKF import/export,
# the wiki agent tools, and the WikiDigest graph extraction, plus their HTTP
# routes and `SpaceInfo`/`UpdateSpaceInput` fields.
wiki = ["dep:sha3", "dep:unicode-normalization"]
# The MCP channel: stdio and Streamable HTTP servers exposing the memory
# tools. With `wiki` also on, the wiki tools join the same tool router.
mcp = ["dep:rmcp", "dep:schemars"]

[dependencies]
async-trait = { workspace = true }
anda_core = { workspace = true }
anda_engine = { workspace = true }
anda_db = { workspace = true }
anda_kip = { workspace = true }
anda_cognitive_nexus = { workspace = true }
anda_object_store = { workspace = true }
anda_db_tfs = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
cbor2 = { workspace = true }
dotenv = { workspace = true }
ic_auth_types = { workspace = true }
ic_cose_types = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
tokio-util = { workspace = true }
structured-logger = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
http = { workspace = true }
object_store = { workspace = true, features = ["aws", "integration"] }
tower = { workspace = true }
tower-http = { workspace = true }
mimalloc = { workspace = true }
rand = { workspace = true }
rmcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
sha3 = { workspace = true, optional = true }
unicode-normalization = { workspace = true, optional = true }

[dev-dependencies]
cose2 = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
