name: Dockers
on:
  workflow_dispatch:
    inputs:
      build_tag:
        description: "Docker image tag"
        required: true
        type: string
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ldclabs/anda_brain
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build the Docker image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login --username ${{ github.actor }} --password-stdin ${{ env.REGISTRY }}
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}_amd64:${{ inputs.build_tag }}"
          LATEST_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}_amd64:latest"
          TAGS="-t ${IMAGE_TAG} -t ${LATEST_TAG}"
          docker build -f anda_brain/Dockerfile $TAGS --push .
